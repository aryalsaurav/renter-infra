apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: storage
  namespace: argocd

spec:
  project: default
  source: 
    repoURL: https://github.com/aryalsaurav/renter-infra.git
    targetRevision: main
    path: argocd/storage
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    
    syncOptions:
      - ServerSideApply=true
