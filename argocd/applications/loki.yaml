apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: loki
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.45.2

    helm:
      releaseName: loki

      values: |
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false

          commonConfig:
            replication_factor: 1

          compactor:
            working_directory: /var/loki/compactor
            retention_enabled: true
            delete_request_store: filesystem
            compaction_interval: 10m
            retention_delete_delay: 2h
          
          limits_config:
            retention_period: 7d
            reject_old_samples: true
            reject_old_samples_max_age: 7d

          storage:
            type: filesystem

            bucketNames:
              chunks: chunks
              ruler: ruler
              admin: admin

          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

        singleBinary:
          replicas: 1

          persistence:
            enabled: true
            size: 10Gi
            storageClass: gp3
            accessModes:
              - ReadWriteOnce

        read:
          replicas: 0

        write:
          replicas: 0

        backend:
          replicas: 0

        gateway:
          enabled: false
        
        chunksCache:
          enabled: false
        
        resultsCache:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true