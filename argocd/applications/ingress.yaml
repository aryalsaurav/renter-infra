apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-ingress
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/aryalsaurav/renter-infra.git
    targetRevision: main
    path: platform/ingress-nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true