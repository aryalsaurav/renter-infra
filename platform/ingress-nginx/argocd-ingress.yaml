apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argocd.aryalsaurav.com.np
      secretName: renter-tls
  rules:
    - host: argocd.aryalsaurav.com.np
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80